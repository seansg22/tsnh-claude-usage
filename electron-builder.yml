appId: com.tsnh.claude-usage
productName: Claude Usage
copyright: Copyright © 2025 tsnh

publish:
  provider: github
  owner: seansg22
  repo: tsnh-claude-usage

directories:
  buildResources: resources
  output: release

files:
  - out/**

extraResources:
  - from: resources/trayIcon.png
    to: trayIcon.png
  - from: resources/icon.png
    to: icon.png

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon.icns
  extendInfo:
    LSUIElement: true
    NSHighResolutionCapable: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - nsis
  icon: resources/icon.ico

linux:
  target:
    - AppImage
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
